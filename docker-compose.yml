# CyberGuard AI — local development topology.
#
# Mirrors section 13 of docs/Architecture/CYBERGUARD_PROJECT.md:
#   backend  Go HTTP API (published on :8080)
#   worker   same image, queue/provider work
#   mongodb  authoritative store (internal only)
#   redis    queue/cache backend (internal only)
#
# MongoDB and Redis deliberately publish no host ports, per section 11.11.
#
#   docker compose up -d --build      start everything
#   docker compose logs -f backend     follow API logs
#   docker compose down                stop
#   docker compose down -v             stop and delete all data

name: cyberguard

x-app-image: &app-image
  build:
    context: ./server
    dockerfile: Dockerfile
    args:
      VERSION: ${VERSION:-dev}
      COMMIT: ${COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
  image: cyberguard-server:dev
  env_file:
    - path: .env
      required: false
  environment: &app-env
    HTTP_ADDR: ":8080"
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    MONGODB_URI: mongodb://mongodb:27017
    MONGODB_DATABASE: ${MONGODB_DATABASE:-cyberguard}
    REDIS_ADDR: redis:6379
    # Selects the analysis backend. "mock" keeps every URL inside the worker
    # process and needs no API key; "hybrid-analysis" uses the real service.
    ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-mock}
    # No "www": that is what the v2 specification declares. A wrong base URL
    # fails as a connection error rather than as an authentication error, which
    # is a confusing way to learn a typo.
    HYBRID_ANALYSIS_BASE_URL: ${HYBRID_ANALYSIS_BASE_URL:-https://hybrid-analysis.com/api/v2}
    HYBRID_ANALYSIS_API_KEY: ${HYBRID_ANALYSIS_API_KEY:-}
    URL_FINGERPRINT_HMAC_KEY: ${URL_FINGERPRINT_HMAC_KEY:-}
    # Required. Without it the API refuses submissions and readiness fails,
    # rather than storing raw URLs in the clear.
    URL_ENCRYPTION_KEY: ${URL_ENCRYPTION_KEY:-}
    # Protection ruleset generation. Defaults mirror .env.example; see ADR 0018
    # for why the thresholds are provisional.
    RULESET_ENABLED: ${RULESET_ENABLED:-true}
    RULESET_MAX_SCOPE: ${RULESET_MAX_SCOPE:-exact_url}
    RULESET_MIN_CORROBORATION: ${RULESET_MIN_CORROBORATION:-2}
    RULESET_MIN_CORROBORATION_PREFIX: ${RULESET_MIN_CORROBORATION_PREFIX:-3}
    RULESET_MIN_CORROBORATION_DOMAIN: ${RULESET_MIN_CORROBORATION_DOMAIN:-5}
    RULESET_MAX_RULES: ${RULESET_MAX_RULES:-5000}
    RULESET_REBUILD_INTERVAL: ${RULESET_REBUILD_INTERVAL:-60s}
    # Serves Swagger UI at /docs/ and the contract at /openapi.yaml. Set to
    # false if the contract should not be browsable; the API is unaffected
    # either way, and no credential is involved.
    API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  # The schema migration runs first and must succeed. See the migrate service
  # below for why an unmigrated database is worse than a failed one.
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # One-shot schema step: creates the indexes the repositories rely on, then
  # exits.
  #
  # It is separate from application startup on purpose. Creating indexes on
  # boot would make every replica restart wait on an index build, and a failed
  # migration would take the service down instead of reporting a degraded one.
  #
  # But running it nowhere is worse than either, because an unmigrated database
  # fails silently rather than loudly. It has no partial unique index, so "one
  # provider submission per URL" quietly stops being true — duplicate scans,
  # duplicate provider submissions, nothing in the logs looking wrong. No TTL
  # index, so encrypted URLs are never reaped. No cache index, so every verdict
  # lookup is a collection scan.
  #
  # Re-run it any time:  docker compose run --rm migrate
  # Check without changing anything:  docker compose run --rm migrate -verify
  migrate:
    <<: *app-image
    container_name: cyberguard-migrate
    entrypoint: ["/usr/local/bin/cyberguard-migrate"]
    # The image HEALTHCHECK probes the API's HTTP listener, which this one-shot
    # program never starts.
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    <<: *app-image
    container_name: cyberguard-backend
    ports:
      - "8080:8080"

  worker:
    <<: *app-image
    container_name: cyberguard-worker
    # Same image, different entrypoint: the worker owns slow provider work.
    entrypoint: ["/usr/local/bin/cyberguard-worker"]
    # The image HEALTHCHECK probes the API's HTTP listener, which the worker
    # does not run, so it would report permanently unhealthy. Disable it here
    # until the worker exposes its own liveness signal.
    healthcheck:
      disable: true

  # Interactive Go toolchain for building and testing on the host side.
  #   docker compose run --rm go test ./...
  #   docker compose run --rm go go build ./...
  go:
    image: golang:1.27-alpine
    working_dir: /src
    volumes:
      - ./server:/src
      # Host-backed caches, created by `make dirs` / setup, so rebuilds are
      # fast and the module cache survives container replacement.
      - ./.cache/go-build:/tmp/gocache
      - ./.cache/go-mod:/tmp/gomod
    environment:
      HOME: /tmp
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomod
      GOPATH: /tmp/gopath
      GOTOOLCHAIN: local
    # Match your host UID/GID so files written into ./server stay yours.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    tty: true
    stdin_open: true
    command: go

  mongodb:
    # Pinned to 9.x, not 8.x: MongoDB 8.0 refuses to start on Linux kernel
    # 6.19+ (SERVER-121912), which this host runs.
    # https://jira.mongodb.org/browse/SERVER-121912
    image: mongo:9.0
    container_name: cyberguard-mongodb
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-cyberguard}
    volumes:
      - mongo-data:/data/db
    # The default container limit is 1024 open files, and mongod runs out at
    # that under an integration-test run that opens a client per test. It then
    # logs "Too many open files" and refuses every new connection, which looks
    # exactly like a database outage.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # No published ports: reachable as "mongodb:27017" inside the network only.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: cyberguard-redis
    # Append-only persistence so queued jobs survive a restart.
    #
    # maxmemory-policy noeviction is a launch blocker, not a tuning knob
    # (ADR 0017). Under an eviction policy Redis silently drops queued scan
    # jobs under memory pressure, which is indistinguishable from a lost job:
    # nothing errors, the scan just never runs. Failing the write instead
    # surfaces the problem, and the reconciler retries.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    # No published ports: reachable as "redis:6379" inside the network only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data: