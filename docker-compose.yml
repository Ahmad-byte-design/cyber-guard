# CyberGuard AI — the whole deployment is two services: the API and MongoDB.
#
# There is no worker, no queue and no Redis: a check-url request performs the
# provider call synchronously inside its own request and stores the result.
#
#   docker compose up -d --build      start everything
#   docker compose logs -f backend    follow the API logs
#   docker compose down               stop
#   docker compose down -v            stop and delete all data
#
# Run the Go toolchain (build, test, vet, gofmt) on the host module:
#
#   docker compose run --rm go test ./...
#   docker compose run --rm go gofmt -l .
#   docker compose run --rm go go vet ./...

name: cyberguard

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Distinct tag: another local project (cyberguard-laravel-*) also builds
    # `cyberguard-api:local`; a shared tag lets their build swap this API's
    # image on the next `up`. `--build` always refreshes this tag.
    image: cyberguard-api:go-local
    container_name: cyberguard-backend
    restart: unless-stopped
    env_file:
      # The host .env feeds the provider settings (API key, base URL, scan
      # type, CORS origins). Anything named again under `environment` below
      # wins: values that must differ inside the Docker network are pinned
      # there on purpose.
      - path: .env
        required: false
    environment:
      # The container always listens on 8080 (matching EXPOSE, the image
      # healthcheck and this port mapping); APP_PORT on the host therefore
      # only selects which host port publishes it.
      APP_PORT: ${APP_PORT:-8080}
      # Inside the Docker network the URI is the service name, never the
      # value .env carries for host runs (mongodb://localhost:27017), so it is
      # defaulted here rather than hardcoded. The default keeps the local stack
      # working against the bundled MongoDB, while an explicit MONGODB_URI in
      # .env (a hosted Atlas SRV string, say) still wins and is passed through.
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongodb:27017}"
      MONGODB_DATABASE: ${MONGODB_DATABASE:-cyberguard}
      # There is no `www` in the base URL: that is the host the official v2
      # specification declares, and the www host answers 301 to it. A Go
      # client does not replay a POST body across the method change a 301
      # implies, so the declared host is the one that works.
      HYBRID_ANALYSIS_BASE_URL: ${HYBRID_ANALYSIS_BASE_URL:-https://hybrid-analysis.com/api/v2}
      HYBRID_ANALYSIS_API_KEY: ${HYBRID_ANALYSIS_API_KEY:-}
      HYBRID_ANALYSIS_TIMEOUT: ${HYBRID_ANALYSIS_TIMEOUT:-30s}
      HYBRID_ANALYSIS_SCAN_TYPE: ${HYBRID_ANALYSIS_SCAN_TYPE:-all}
      # An empty value falls back to the in-code defaults (localhost dev
      # origins). Listing origins in .env is the normal production setup.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy

  # Interactive Go toolchain for building and testing the module as it sits on
  # the host, without requiring Go on the host itself. It lives under the
  # "tools" profile, so it never starts with plain `docker compose up`; use
  # docker compose run (--profile tools where the CLI grumbles) to enter it.
  go:
    profiles: ["tools"]
    image: golang:1.27-alpine
    working_dir: /src
    volumes:
      - .:/src
      # Host-backed caches, so rebuilds are fast and the module cache
      # survives container replacement.
      - ./.cache/go-build:/tmp/gocache
      - ./.cache/go-mod:/tmp/gomod
    environment:
      HOME: /tmp
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomod
      GOPATH: /tmp/gopath
      GOTOOLCHAIN: local
    # Match your host UID/GID so files written into ./ stay yours.
    # Check with: id -u && id -g
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    tty: true
    stdin_open: true
    command: go

  mongodb:
    # Pinned to 9.x, not 8.x: MongoDB 8.0 refuses to start on Linux kernel
    # 6.19+ (SERVER-121912), which this host runs.
    # https://jira.mongodb.org/browse/SERVER-121912
    image: mongo:9.0
    container_name: cyberguard-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-cyberguard}
    volumes:
      - mongo-data:/data/db
    # The default container limit is 1024 open files; mongod runs out at that
    # under an integration-test run that opens a client per test and then
    # looks exactly like a database outage.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # No published ports: reachable as "mongodb:27017" from the API container
    # on the compose network only.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
