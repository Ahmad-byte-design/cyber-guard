# CyberGuard AI — backend CI.
#
# Scope: the Go backend only. There is no frontend, so nothing here builds one.
#
# Credentials: none. No Hybrid Analysis key is available to a pull request and
# none is needed: provider behaviour is faked with httptest, so every path
# this workflow exercises is deterministic. The compose smoke test therefore
# asserts exactly what a key-less deployment can answer: request validation,
# the provider_not_configured response, the store endpoints and the docs.

name: backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-progress run of the same ref.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  # Fast feedback first: formatting, hygiene, vet, build and unit tests need
  # no running services.
  checks:
    name: format, vet, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: docker compose run --rm go gofmt -w cmd internal docs"
            exit 1
          fi
          echo "gofmt clean"

      # go mod tidy must be a no-op: a non-empty diff means the committed
      # go.mod/go.sum do not describe the module.
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go mod tidy changed the tree:"
            git diff -- go.mod go.sum
            exit 1
          fi
          echo "go.mod and go.sum are tidy"

      - run: go vet ./...

      - run: go build ./...

      # -race needs cgo, which needs a C toolchain.
      - name: unit tests (with race detector)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          CGO_ENABLED=1 go test -race -count=1 -cover -coverprofile=coverage.out ./...

  # The store's only direct tests (index creation, insertion, newest-first
  # paging) need a real MongoDB. Everything else stays fake — no provider is
  # contacted here either.
  integration:
    name: store tests against real MongoDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Start MongoDB
        run: |
          sudo docker run -d --name ci-mongo -p 27017:27017 mongo:9.0
          for _ in $(seq 1 30); do
            if sudo docker exec ci-mongo mongosh --quiet \
                 --eval "db.adminCommand('ping').ok" | grep -q 1; then
              exit 0
            fi
            sleep 2
          done
          echo "mongodb did not become ready"; exit 1

      - name: Store tests
        env:
          MONGO_TEST_URI: mongodb://localhost:27017
        run: go test -count=1 -run TestStore ./internal/mongodb

  # The image must build, and the compose topology must come up healthy.
  # This exercises the Dockerfile, the healthchecks, the depends_on ordering
  # and the key-less runtime behaviour end to end.
  compose:
    name: compose topology and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Health endpoints
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/health/live | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/health/ready | grep -q '"status":"ready"'

      # No API key exists in CI, so check-url must fail closed with
      # provider_not_configured — and request validation runs first, so its
      # own errors come back before anything provider-shaped.
      - name: check-url fails closed without a key
        run: |
          set -euo pipefail
          tip() { python3 -c 'import json,sys; b=json.load(sys.stdin); sys.exit(0 if b["success"] is False else 1)'; }
          echo "--- malformed JSON body ---"
          code="$(curl -sS -o /tmp/r1.json -w '%{http_code}' \
            -X POST http://localhost:8080/api/v1/check-url \
            -H 'Content-Type: application/json' \
            -d 'not-json')"
          echo "$code $(cat /tmp/r1.json)"
          [ "$code" = "400" ]
          cat /tmp/r1.json | tip
          grep -q '"code":"invalid_request"' /tmp/r1.json
          echo "--- unsupported scheme ---"
          code="$(curl -sS -o /tmp/r2.json -w '%{http_code}' \
            -X POST http://localhost:8080/api/v1/check-url \
            -H 'Content-Type: application/json' \
            -d '{"url":"ftp://example.invalid/x"}')"
          echo "$code $(cat /tmp/r2.json)"
          [ "$code" = "422" ]
          cat /tmp/r2.json | tip
          grep -q '"code":"validation_error"' /tmp/r2.json
          echo "--- valid URL, no key configured ---"
          code="$(curl -sS -o /tmp/r3.json -w '%{http_code}' \
            -X POST http://localhost:8080/api/v1/check-url \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.invalid/"}')"
          echo "$code $(cat /tmp/r3.json)"
          [ "$code" = "503" ]
          grep -q '"code":"provider_not_configured"' /tmp/r3.json
          echo "check-url failed closed correctly"

      - name: get-all works empty
        run: |
          set -euo pipefail
          body="$(curl -fsS 'http://localhost:8080/api/v1/get-all?page=1&limit=10')"
          echo "$body"
          cat <<<"$body" | python3 -c '
            import json, sys
            b = json.load(sys.stdin)
            assert b["success"] is True
            assert b["data"] == []
            assert b["pagination"] == {"page": 1, "limit": 10, "total": 0, "totalPages": 0}
            assert b["pagination"]["limit"] == 10
          '

      - name: Documentation endpoints are served
        run: |
          set -euo pipefail
          # Swagger UI must render without external network access, so the
          # page may only reference same-origin relative assets.
          curl -fsS http://localhost:8080/docs/ > /tmp/docs.html
          grep -q 'id="swagger-ui"' /tmp/docs.html
          grep -q '"../openapi.yaml"' /tmp/docs.html
          if grep -qE '(src|href)="(https?:)?//' /tmp/docs.html; then
            echo "the page loads an asset from another origin:"
            grep -oE '(src|href)="[^"]*"' /tmp/docs.html
            exit 1
          fi

          for asset in swagger-ui.css swagger-ui-bundle.js swagger-ui-standalone-preset.js; do
            curl -fsS "http://localhost:8080/docs/assets/$asset" -o /dev/null
          done

          # The served contract must be the committed contract, byte for byte.
          curl -fsS http://localhost:8080/openapi.yaml -o /tmp/live.yaml
          if ! diff -q /tmp/live.yaml docs/openapi.yaml > /dev/null; then
            echo "the served specification differs from docs/openapi.yaml"
            exit 1
          fi
          echo "documentation served from embedded assets only"

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
