openapi: 3.1.0

# CyberGuard AI — API contract.
#
# This document is the authoritative contract for CyberGuard AI's HTTP API
# (ADR 0015). docs/api-contract.md is its narrative companion: it explains
# rationale, status-code semantics and client guidance. Where the two disagree,
# this file wins and api-contract.md is a bug.
#
# Contract drift is enforced in CI, not by generating handlers from this file:
# internal/httpapi/openapi_test.go asserts every path here is registered in the
# router and every registered path appears here.
#
# It lives inside the Go module, next to the code it describes, so that drift
# check can reach it from any environment — a bare `go test ./...` with no
# Compose mount, in CI, or locally.

info:
  title: CyberGuard AI API
  version: 1.0.0
  summary: URL threat-checking backend for the CyberGuard AI browser extension.
  description: |
    Checks a URL against known threat intelligence and, when no fresh result
    exists, queues an asynchronous analysis against an external sandbox
    provider.

    ## Authentication

    There is **no application-level authentication in v1**. A browser extension
    cannot hold a secret that is not extractable from its own package, so no
    credential is shipped to the client. Abuse control is provided by rate
    limits, quotas, request limits and concurrency controls instead, and the
    initial deployment is private / self-hosted. See ADR 0014.

    ## Verdict semantics

    `no_threat_detected` means the analysis completed and found no indicators
    sufficient to classify the sample. It is **not** a safety guarantee and must
    not be rendered as "safe", "trusted" or "secure". No failure path ever
    produces it — see ADR 0011.

    ## Privacy

    Raw URLs are never stored and never returned by any endpoint. Results are
    addressed by an opaque `scan_id`, deliberately chosen over putting a URL in
    a path or query string so that proxies and access logs never receive one.

  license:
    name: Unlicensed
    url: https://cyberguard.example/license

servers:
  # The first entry is the default that Swagger UI's "Try it out" uses, so it
  # points at the documented local deployment. Both names are listed because
  # `localhost` and `127.0.0.1` reach the same process but are different origins
  # to a browser, and a client that loaded the UI over one of them will be
  # refused by the other's CORS rules.
  #
  # For a non-local deployment, add its origin here. That is the intended place:
  # this list is the documented server selection, and Swagger UI offers it as a
  # dropdown.
  - url: http://127.0.0.1:8080
    description: Local development (Docker Compose)
  - url: http://localhost:8080
    description: Local development by name

tags:
  - name: analysis
    description: URL submission and scan status
  - name: rulesets
    description: Versioned browser protection rules
  - name: health
    description: Liveness and readiness probes
  - name: documentation
    description: This contract and its Swagger UI

paths:
  /health/live:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Reports that the process is alive and serving.

        Deliberately checks no dependency. A MongoDB outage must not
        cause an orchestrator to restart every replica, which would turn a
        dependency failure into a full outage.
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
              example:
                status: ok

  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Reports whether the process can do useful work.

        Fails readiness when a required dependency is unreachable or a required
        secret is unset. A missing provider credential is reported as a degraded
        sub-check rather than a global failure, because cached reads still work
        without a provider.
      security: []
      responses:
        "200":
          description: Ready to receive traffic.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: ready
                checks:
                  - name: config
                    ok: true
                  - name: url_fingerprint_hmac_key
                    ok: true
                  - name: url_encryption_key
                    ok: true
                  - name: mongodb
                    ok: true
                  - name: provider
                    ok: true
        "503":
          description: Not ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /api/v1/check-url:
    post:
      tags: [analysis]
      operationId: checkURL
      summary: Check a URL, reusing a cached verdict or queueing an analysis
      description: |
        Validates a URL and either returns a stored verdict or starts an
        asynchronous analysis.

        At most one provider submission is created per URL fingerprint per
        freshness window, however many concurrent clients ask.

        The raw URL is processed transiently, reduced to a keyed HMAC
        fingerprint, and then discarded. It is never persisted and never logged.

        **At most one provider submission per fingerprint per freshness window**,
        enforced by a partial unique index in MongoDB rather than by a
        read-then-write check, so concurrent requests cannot both proceed.

        A URL whose host is loopback, private, link-local or otherwise
        non-public is refused with `422` before anything is stored, so an
        internal address is never disclosed to an external sandbox.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/URLRequest"
            examples:
              valid:
                value:
                  url: https://example.test/login
      responses:
        "200":
          description: A fresh assessment already exists.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CachedAssessment"
              example:
                scan_id: scan_01J8ZP4K7Q
                status: completed
                cached: true
                verdict: malicious
                evidence:
                  - type: provider_verdict
                    summary: "analysis finished with verdict malicious; provider state SUCCESS"
                analyzed_at: "2026-10-17T09:56:13Z"
                expires_at: "2026-10-17T10:56:13Z"
        "202":
          description: |
            Analysis queued, already running, or scheduled for retry. The client
            polls `status_url` for the outcome.

            The URL was accepted but **has not** been analysed, so this response
            deliberately carries no verdict. A client that treats `202` as a
            result would be reporting an answer nobody computed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAssessment"
              example:
                scan_id: scan_01J8ZP4K7Q
                status: queued
                cached: false
                status_url: /api/v1/get-url/scan_01J8ZP4K7Q
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/get-url/{scanId}:
    get:
      tags: [analysis]
      operationId: getScan
      summary: Retrieve the status and outcome of a scan
      description: |
        Returns the status of a previously accepted submission.

        A scan ID is used rather than a URL so that proxies and access logs
        never receive the URL. Clients should treat the ID as opaque and poll
        with exponential backoff.
      security: []
      parameters:
        - name: scanId
          in: path
          required: true
          description: Opaque scan identifier returned by `check-url`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: The scan record.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
              examples:
                queued:
                  summary: Accepted, not yet analysed. Carries no verdict.
                  value:
                    scan_id: scan_01J8ZP4K7Q
                    status: queued
                running:
                  summary: A scan runner has claimed it and the submission is in flight.
                  value:
                    scan_id: scan_01J8ZP4K7Q
                    status: running
                completed:
                  summary: |
                    A terminal report was normalised and stored. Only this state
                    carries a verdict.
                  value:
                    scan_id: scan_01J8ZP4K7Q
                    status: completed
                    verdict: malicious
                    provider: mock
                    evidence:
                      - type: provider_verdict
                        summary: "analysis finished with verdict malicious; provider state SUCCESS"
                    analyzed_at: "2026-10-17T09:56:13Z"
                    expires_at: "2026-10-17T10:56:13Z"
                completed_but_inconclusive:
                  summary: |
                    The analysis finished without a conclusive answer.
                    **This is not a clean result.** Re-submit later.
                  value:
                    scan_id: scan_01J8ZP4K7Q
                    status: completed
                    verdict: inconclusive
                    provider: mock
                    evidence:
                      - type: provider_verdict
                        summary: "analysis finished with verdict inconclusive; provider state SUCCESS"
                    analyzed_at: "2026-10-17T09:56:13Z"
                    expires_at: "2026-10-17T10:56:13Z"
                failed:
                  summary: |
                    Ended in error. **No verdict is present and none is implied.**
                    `error_code` is a safe, low-cardinality reason; provider
                    internals are never passed through.
                  value:
                    scan_id: scan_01J8ZP4K7Q
                    status: failed
                    error_code: provider_poll_timeout
                timed_out:
                  summary: The provider did not report within the deadline.
                  value:
                    scan_id: scan_01J8ZP4K7Q
                    status: timed_out
                    error_code: provider_poll_timeout
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          description: No scan record exists for this identifier.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://cyberguard.example/problems/scan_not_found
                title: Scan not found
                status: 404
                detail: no scan record exists for this id yet
                instance: /api/v1/get-url/scan_01XYZ
                request_id: 40831b5ecb146081731ec7fb
                code: scan_not_found
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/get-url:
    post:
      tags: [analysis]
      operationId: getScanByURL
      summary: Retrieve the current state of the most recent scan for a URL
      description: |
        The same lookup as `GET /api/v1/get-url/{scanId}`, for a caller that
        has a URL but did not keep the scan ID.

        ### Why this is a POST and not `GET /api/v1/get-url/{url}`

        A URL in a path is a URL in every access log between here and the
        client: this service's, the reverse proxy's, the load balancer's, and
        anything else that records request lines. That is the exposure
        [ADR 0013](decisions/0013-durable-jobs-and-url-privacy.md) exists to
        prevent, and it is why the by-ID form takes an opaque identifier.

        A request body is not recorded by any of those by default. Expressing
        the lookup as a POST keeps the URL out of every access log while still
        letting a client find its scan.

        The trade is that this endpoint cannot be linked to, prefetched, or
        cached by a URL-aware intermediary. For a rate-limited diagnostic read
        that is the right way round.

        ### This reads; it never starts anything

        No scan is created, nothing is queued, and no provider is contacted. A
        caller that wants a **verdict** should use `POST /api/v1/check-url`,
        which analyses what is missing and returns `200` when a fresh verdict
        already exists.

        This matters for quota as well as for semantics: a lookup that could
        trigger analysis would be a second submission endpoint under another
        name, with no separate accounting.

        ### Which scan is returned

        The most recent one, in any status. Not the most recent *completed* one:
        reporting an older verdict while a fresh analysis of the same URL is
        still running would answer a question the caller did not ask. When no
        scan exists at all the result is `404 scan_not_found`.

        ### Validation

        Identical to `POST /api/v1/check-url`, including the target gate. The
        same URL therefore produces the same status and the same `code` through
        either endpoint, so a client that submits and then polls never sees a
        validation error change shape between calls.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/URLRequest"
            example:
              url: https://example.test/login
      responses:
        "200":
          description: |
            The most recent scan for this URL. Identical in shape to
            `GET /api/v1/get-url/{scanId}`, and a verdict is present only when
            the scan is `completed` and its assessment is still fresh.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
              example:
                scan_id: scan_01J8ZP4K7Q
                status: completed
                verdict: malicious
                provider: mock
                evidence:
                  - type: provider_verdict
                    summary: "analysis finished with verdict malicious; provider state SUCCESS"
                analyzed_at: "2026-10-17T09:56:13Z"
                expires_at: "2026-10-17T10:56:13Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          description: No scan has ever been created for this URL.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://cyberguard.example/problems/scan_not_found
                title: Scan not found
                status: 404
                detail: no scan record exists for this url
                instance: /api/v1/get-url
                request_id: 40831b5ecb146081731ec7fb
                code: scan_not_found
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/get-all:
    get:
      tags: [rulesets]
      operationId: getRuleset
      summary: Retrieve the current browser protection ruleset
      description: |
        Returns the current versioned ruleset — a generated, derived artefact,
        not a database of every URL ever checked.

        Supply `version` to avoid re-downloading an unchanged ruleset. Version 0
        with an empty `rules` array is a valid, truthful answer meaning nothing
        has been published yet; it is not an error.

        ### What becomes a rule

        A rule is **never** produced by a verdict alone. See ADR 0011 and
        ADR 0018.

        | Verdict | Rule eligible |
        |---|---|
        | `malicious` | Only with corroboration, and only when the corroborated scope's threshold is met |
        | `suspicious` | Never |
        | `no_threat_detected` | Never |
        | `inconclusive` | Never |
        | `unknown` | Never |

        "Corroboration" means a count of **distinct URL fingerprints**, so
        rescanning one URL many times is one finding, not many. Expired findings
        never count.

        ### Scope

        Rules widen as evidence strengthens, and never beyond the configured
        ceiling:

        | Scope | Match | Evidence required (defaults) |
        |---|---|---|
        | `exact_url` | one `scheme://host[:port]/path` | 2 findings on the host |
        | `url_prefix` | one path prefix on one host | 3 findings on that prefix |
        | `registrable_domain` | the registrable domain and its subdomains | 5 findings across the domain |

        The default ceiling is `exact_url`, so a default deployment can never
        emit anything broader than a single-URL rule.

        ### Actions

        `RULESET_ACTION` selects `block` (the default) or `redirect`. A
        redirect sends the user to the extension page named by
        `RULESET_REDIRECT_PATH`, which must be declared in the client's
        `web_accessible_resources` or Chrome refuses to install the ruleset.

        ### Limits

        `RULESET_MAX_RULES` caps the snapshot and `RULESET_MAX_REGEX_RULES` caps
        the rules built on a regular expression. The second is the tighter
        constraint: Chrome's documented limit is 1000 per ruleset, and exceeding
        it makes Chrome ignore the ruleset rather than reject it.

        ### Versioning

        The version increments **only** when the effective rule set changes. A
        rebuild that produces identical rules leaves the version alone, so a
        polling client is not made to re-download continuously.
      security: []
      parameters:
        - name: version
          in: query
          required: false
          description: The client's currently installed ruleset version.
          schema:
            type: integer
            minimum: 0
        - name: If-None-Match
          in: header
          required: false
          description: Conditional request using the snapshot ETag.
          schema:
            type: string
      responses:
        "200":
          description: |
            The ruleset snapshot.

            With `version` matching the current version, the response carries
            `unchanged: true` and an empty `rules` array — or a `304` when the
            client sent a matching `If-None-Match`.
          headers:
            ETag:
              description: Entity tag of the returned snapshot, for example `"v12"`.
              schema:
                type: string
            X-Ruleset-Version:
              description: The published version, mirrored for clients that read headers only.
              schema:
                type: integer
            X-Ruleset-Rolled-Back:
              description: |
                Present and `true` when the client reported a version **newer** than
                the server's, meaning it installed a ruleset from a different
                deployment. The full snapshot is still returned so the client can
                recover.
              schema:
                type: string
                enum: ["true"]
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruleset"
              examples:
                empty:
                  summary: |
                    Nothing has been published yet. Version 0 with no rules is a
                    truthful answer, not an error.
                  value:
                    version: 0
                    generated_at: "2026-10-17T09:51:33Z"
                    rules: []
                with_rules:
                  summary: A published snapshot.
                  value:
                    version: 2
                    generated_at: "2026-10-17T09:56:13Z"
                    rules:
                      - id: 1
                        priority: 1
                        action:
                          type: block
                        condition:
                          filter:
                            type: regexFilter
                            regexFilter: '^https://example\.test/login$'
                          resourceTypes:
                            - main_frame
                            - sub_frame
                unchanged:
                  summary: |
                    Sent when the client's `version` already matches the
                    server's. No rules are transferred.
                  value:
                    version: 2
                    generated_at: "2026-10-17T09:56:13Z"
                    unchanged: true
                    rules: []
              example:
                version: 0
                generated_at: "2026-10-16T12:00:00Z"
                rules: []
        "304":
          description: The client's ruleset is already current.
          headers:
            ETag:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /docs/:
    get:
      tags: [documentation]
      operationId: getSwaggerUI
      summary: Interactive Swagger UI for this contract
      description: |
        Serves an interactive console for the API described by this document,
        including a **Try it out** control on every operation.

        ### What is served

        Swagger UI is vendored into the server binary at a pinned version and
        embedded at build time. **No external network access is used**: the page
        works in an air-gapped deployment and renders identically on every
        installation of this build.

        ### Trying an operation out

        1. Open this page.
        2. Pick an operation and expand it.
        3. Choose a server from the dropdown. The default is the first entry of
           this document's `servers` list, `http://127.0.0.1:8080`.
        4. Press **Try it out**, fill in the parameters, and press **Execute**.

        For `POST /api/v1/check-url` a submission returns `202` with a
        `status_url`; paste that path into `GET /api/v1/get-url/{scanId}` and
        execute again to poll.

        ### Limitations

        - **The server list is fixed by this document.** Behind a reverse proxy
          or on another port, add your origin to `servers` and redeploy; the
          dropdown cannot discover deployments on its own.
        - **CORS still applies.** If you select a server on a different origin
          than the one serving this page, the browser blocks the request before
          it is sent. Same-origin, which is the local default, always works.
        - **No authentication exists on this API**, so there is nothing to
          supply. The UI is configured not to persist credentials.
        - **The UI does not poll for you.** It issues one request per **Execute**.
      security: []
      responses:
        "200":
          description: The Swagger UI page.
          headers:
            ETag:
              description: Entity tag of the generated page.
              schema:
                type: string
            X-Content-Type-Options:
              description: Always `nosniff`.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
              example: |
                <!DOCTYPE html>
                <html lang="en">
                <head><title>CyberGuard AI API</title></head>
                <body><div id="swagger-ui"></div></body>
                </html>

  /docs/assets/{name}:
    get:
      tags: [documentation]
      operationId: getSwaggerUIAsset
      summary: A static asset used by the Swagger UI page
      description: |
        Serves the vendored Swagger UI stylesheet, scripts and favicons that
        `/docs/` loads.

        The file name must match exactly. There is no directory listing and no
        path resolution, so any other name returns `404`.
      security: []
      parameters:
        - name: name
          in: path
          required: true
          description: File name of a permitted asset.
          schema:
            type: string
            enum:
              - swagger-ui.css
              - swagger-ui-bundle.js
              - swagger-ui-standalone-preset.js
              - favicon-16x16.png
              - favicon-32x32.png
      responses:
        "200":
          description: The asset.
          headers:
            ETag:
              description: Entity tag derived from the asset's content.
              schema:
                type: string
            Cache-Control:
              description: |
                Always `public, max-age=31536000, immutable`. Assets are
                identified by content, so a cached copy stays correct until the
                binary is upgraded.
              schema:
                type: string
          content:
            text/css:
              schema:
                type: string
            text/javascript:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: The client already holds this representation.
        "404":
          description: No such asset.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://cyberguard.example/problems/scan_not_found
                title: Not found
                status: 404
                detail: the requested asset does not exist
                instance: /docs/assets/swagger-ui.js
                request_id: 40831b5ecb146081731ec7fb
                code: not_found

  /openapi.yaml:
    get:
      tags: [documentation]
      operationId: getOpenAPIDocument
      summary: This OpenAPI document, as YAML
      description: |
        Returns the authoritative contract as raw YAML: the same bytes that are
        committed to the repository, embedded into the binary at build time.

        It is served so that a client can discover the contract from the
        service itself, and so the documentation cannot drift from the code it
        describes — a deployment has no separate file to fall out of step.

        This document is served even when the rest of the service is degraded:
        it touches no datastore, so it remains available for diagnosing an
        outage it may help explain.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          headers:
            ETag:
              description: Entity tag derived from the document's content.
              schema:
                type: string
            X-Content-Type-Options:
              description: Always `nosniff`.
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
              example: |
                openapi: 3.1.0
                info:
                  title: CyberGuard AI API
                  version: 1.0.0
        "304":
          description: The client already holds this representation.

components:
  headers:
    RequestID:
      description: |
        Correlation identifier. Echoed when supplied by the client, otherwise
        minted. Present on every response and on every related log line.
      schema:
        type: string
        maxLength: 64

  responses:
    BadRequest:
      description: The request body is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cyberguard.example/problems/invalid_request
            title: Invalid request
            status: 400
            detail: request body must be a JSON object with a "url" field
            instance: /api/v1/check-url
            request_id: 40831b5ecb146081731ec7fb
            code: invalid_request

    ValidationError:
      description: |
        The URL failed validation, or the target is prohibited.

        `422` is used rather than `400` because the request was syntactically
        well-formed: it was the *value* that cannot be accepted. Every one of
        these is refused before anything is stored, so no internal address is
        ever disclosed to an external sandbox.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unsupported_scheme:
              summary: The scheme is not http or https
              value:
                type: https://cyberguard.example/problems/validation_error
                title: Validation error
                status: 422
                detail: "url: scheme must be http or https"
                instance: /api/v1/check-url
                request_id: 40831b5ecb146081731ec7fb
                code: validation_error
            private_target:
              summary: |
                The host is loopback, private, link-local or otherwise
                non-public. Refused so an internal address is never sent to a
                third-party analysis service.
              value:
                type: https://cyberguard.example/problems/validation_error
                title: Validation error
                status: 422
                detail: "url: host resolves to a prohibited address"
                instance: /api/v1/check-url
                request_id: 40831b5ecb146081731ec7fb
                code: validation_error
            no_hostname:
              summary: The URL has no hostname.
              value:
                type: https://cyberguard.example/problems/validation_error
                title: Validation error
                status: 422
                detail: "url: missing hostname"
                instance: /api/v1/check-url
                request_id: 40831b5ecb146081731ec7fb
                code: validation_error
            embedded_credentials:
              summary: |
                The URL carries `user:password@` credentials. They would be
                written to the provider, so they are refused rather than
                stripped.
              value:
                type: https://cyberguard.example/problems/validation_error
                title: Validation error
                status: 422
                detail: "url: embedded credentials are not accepted"
                instance: /api/v1/check-url
                request_id: 40831b5ecb146081731ec7fb
                code: validation_error

    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cyberguard.example/problems/rate_limited
            title: Rate limited
            status: 429
            detail: too many submissions for this URL fingerprint
            instance: /api/v1/check-url
            request_id: 40831b5ecb146081731ec7fb
            code: rate_limited

    ServiceUnavailable:
      description: A required dependency is unavailable or unconfigured.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://cyberguard.example/problems/not_ready
            title: Service not ready
            status: 503
            detail: URL fingerprinting is unavailable; URL_FINGERPRINT_HMAC_KEY is not set
            instance: /api/v1/check-url
            request_id: 40831b5ecb146081731ec7fb
            code: not_ready

  schemas:
    Verdict:
      type: string
      description: |
        CyberGuard's normalised security verdict.

        `no_threat_detected` is an absence of indicators, **not** an assurance
        of safety. `inconclusive` means the analysis ran without a conclusive
        result; `unknown` means it could not be determined at all.
      enum:
        - malicious
        - suspicious
        - no_threat_detected
        - inconclusive
        - unknown

    ScanStatus:
      type: string
      description: |
        Technical job status. Independent of the verdict: a verdict exists only
        when the status is `completed`.
      enum:
        - queued
        - running
        - completed
        - failed
        - timed_out
        - expired

    URLRequest:
      type: object
      description: |
        A URL to act on.

        Used by `POST /api/v1/check-url`, which may create a scan, and by
        `POST /api/v1/get-url`, which only reads. The two validate identically,
        so the same URL produces the same result whichever is used.
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            An absolute `http` or `https` URL. Rejected if it carries embedded
            credentials, exceeds 2048 characters, contains control characters,
            has no hostname, or names a loopback, private, reserved or internal
            address.

            The value is **never** stored and **never** logged. It exists in
            this request only long enough to compute a keyed fingerprint.

    Evidence:
      type: object
      required: [type, summary]
      additionalProperties: false
      properties:
        type:
          type: string
          description: Machine-readable evidence category.
          examples: [provider_verdict]
        summary:
          type: string
          description: Human-readable explanation, bounded in length.

    CachedAssessment:
      type: object
      required: [scan_id, status, cached, verdict]
      properties:
        scan_id:
          type: string
        status:
          type: string
          const: completed
        cached:
          type: boolean
          const: true
        verdict:
          $ref: "#/components/schemas/Verdict"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        analyzed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: After this instant the verdict is not fresh.

    PendingAssessment:
      type: object
      required: [scan_id, status, cached, status_url]
      properties:
        scan_id:
          type: string
        status:
          $ref: "#/components/schemas/ScanStatus"
        cached:
          type: boolean
          const: false
        status_url:
          type: string
          description: Relative path to poll for the outcome.
          examples: ["/api/v1/get-url/scan_01XYZ"]
        retrying:
          type: boolean
          description: Present and true when a previous attempt failed and a retry is scheduled.

    ScanResult:
      type: object
      required: [scan_id, status]
      properties:
        scan_id:
          type: string
        status:
          $ref: "#/components/schemas/ScanStatus"
        verdict:
          $ref: "#/components/schemas/Verdict"
          description: |
            Present **only** when `status` is `completed` **and** the
            assessment is still within its freshness window.

            An expired verdict is omitted rather than returned: presenting
            week-old security information as the current answer would let a
            client act on stale data. Re-submit through `check-url`, which
            re-runs the freshness check.
        provider:
          type: string
          description: Opaque provider identifier, e.g. `hybrid-analysis`.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        analyzed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        error_code:
          type: string
          description: |
            Safe, low-cardinality failure reason on a non-completed scan.

            Provider error codes are normalised to CyberGuard's own vocabulary so
            that provider internals never leak to a client. The mapping lives in
            `internal/providers/hybridanalysis`.
          examples:
            - provider_auth_failed
            - provider_rate_limited
            - provider_bad_response
            - provider_unavailable
            - provider_not_configured
            - provider_analysis_failed
            - provider_poll_timeout
            - submission_outcome_unknown
            - submission_not_recorded
            - input_unavailable
            - attempts_exhausted
            - dependency_unavailable

    Ruleset:
      type: object
      required: [version, generated_at, rules]
      properties:
        version:
          type: integer
          minimum: 0
          description: |
            Monotonically increasing and contiguous from 1. Increments **only**
            when the effective rule set changes; an identical rebuild leaves it
            alone. Version 0 means nothing has been published, and is never
            stored.
        generated_at:
          type: string
          format: date-time
        unchanged:
          type: boolean
          description: |
            True when the client's requested version already matches the
            server's. Omitted otherwise, so its absence is meaningful.
        rules:
          type: array
          description: |
            Chrome `declarativeNetRequest` rules, with unique positive
            identifiers.

            Every rule is validated against Chrome's documented schema before
            publication. An invalid rule fails the **entire** snapshot: a
            partial ruleset is never published, because it would silently
            under-block while the client believed coverage was complete.

            Provenance is stored alongside each rule for audit but is **not**
            emitted here — Chrome rejects unknown members inside a Rule, so
            including it would break the ruleset on the client's machine.
          items:
            $ref: "#/components/schemas/DNRRule"

    DNRRule:
      type: object
      description: |
        One Chrome `declarativeNetRequest` rule.

        CyberGuard emits only two action types. It never emits `allow` or
        `allowAllRequests`, because those grant trust and this service only
        ever withholds it, and never `upgradeScheme` or `modifyHeaders`,
        because neither is a protection decision this product makes.

        ### Identifier strategy

        Identifiers are assigned by position in the published order, so they
        are positive and contiguous from 1 and deterministic for a given body
        of evidence. They are **not** stable across a removal: dropping the
        first rule shifts later identifiers by one.

        That is deliberate. A client replaces the whole ruleset rather than
        reconciling rule-by-rule, and an identifier that stayed put while its
        meaning changed would be worse than one that shifts.

        ### Priority and precedence

        Every rule carries the same priority. Chrome resolves a request to at
        most one action by ordering matching rules by priority and then, at
        equal priority, by action — `allow` > `block` > `upgradeScheme` >
        `redirect`.

        Since no `allow` rule is emitted, a `block` rule and a `redirect` rule
        that both match resolve to **block**. That is the outcome this product
        wants, so the ordering is left to Chrome rather than pinned, and the
        published ruleset does not depend on an implementation detail the
        documentation explicitly says is not standardised between runs.

        ### Regex rules

        Rules built on `regexFilter` are capped at 1000 per ruleset, which is
        Chrome's documented limit and far below the total rule limit. Exceeding
        it makes Chrome ignore the ruleset rather than reject it, so a client
        would carry no protection while appearing up to date.
      required: [id, priority, action, condition]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
          description: Unique positive identifier within the ruleset.
        priority:
          type: integer
          minimum: 1
          description: |
            Chrome's rule priority. Uniform across every emitted rule, so
            action precedence is decided by Chrome's documented ordering.
        action:
          $ref: "#/components/schemas/DNRAction"
        condition:
          $ref: "#/components/schemas/DNRCondition"

    DNRAction:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [block, redirect]
          description: |
            `block` refuses the request. `redirect` sends it to a page inside
            the extension instead.

            Chrome's tie-break at equal priority puts `block` ahead of
            `redirect`, so where both match, the request is blocked.
        redirect:
          $ref: "#/components/schemas/DNRRedirect"
          description: Present if and only if `type` is `redirect`.

    DNRRedirect:
      type: object
      required: [extensionPath]
      additionalProperties: false
      properties:
        extensionPath:
          type: string
          pattern: "^/[^?#]*$"
          description: |
            A path relative to the extension's own directory, resolving to
            `chrome-extension://<id>/locked.html`.

            Chrome also permits `redirect.url` and `redirect.transform`. Neither
            is emitted and neither is modelled here: both would send a user's
            browser to a destination chosen by an assessment rather than by this
            policy.

            **Client obligation:** the extension must declare this path in its
            manifest `web_accessible_resources`. Chrome refuses a DNR redirect to
            a resource that is not web accessible, and the ruleset will not
            install.
      example:
        extensionPath: /locked.html

    DNRCondition:
      type: object
      description: |
        What a rule matches.

        Exactly one of `urlFilter` and `filter` may be set.
      additionalProperties: false
      properties:
        urlFilter:
          type: string
          maxLength: 30000
          description: |
            Chrome's pattern syntax, used for the registrable-domain and
            URL-prefix scopes.

            The grammar is `(optional anchor) + pattern + (optional anchor)`
            with only four constructs — `*`, `|`, `||` and `^` — and **no
            documented escape**. A candidate whose host or path contains an
            operator, or a non-ASCII character, is therefore **rejected** rather
            than escaped into a pattern nobody can verify.

            Emitted forms are `||host^` and `||host^/prefix`. `||` anchors to
            the start of a (sub-)domain, so the literal begins at a label
            boundary and `evil-example.com` is not matched by a rule for
            `example.com`. `^` matches any character that is not a letter,
            digit, `_`, `-`, `.` or `%`, and also the end of the URL, which is
            what stops `example.com` from matching `example.company`.
          examples:
            - "||example.com^"
            - "||example.com/login^"
        filter:
          type: object
          description: |
            Chrome's RE2 matcher, used for the exact-URL scope because
            `urlFilter` is a prefix match and would also cover longer paths.
          required: [type, regexFilter]
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [regexFilter]
            regexFilter:
              type: string
              maxLength: 2048
              description: |
                An anchored RE2 pattern: `^scheme://host[:port]/path$`.

                Chrome requires a regex to be ASCII only, because it is matched
                against a URL whose host is punycoded and whose other characters
                are percent-encoded.

                The **query string is not part of the pattern**, because the
                assessment does not retain one. Two URLs differing only in query
                therefore share a rule — recorded in
                [ADR 0018](decisions/0018-ruleset-thresholds-and-scope.md).
        resourceTypes:
          type: array
          description: |
            The request types this rule applies to.

            Always present. When both this and `excludedResourceTypes` are
            omitted, Chrome treats the rule as matching every type **except
            `main_frame`** — so omitting the list would silently stop a rule
            blocking navigation, which is the opposite of its purpose.

            A `block` rule uses the configured profile, which always includes
            `main_frame`. A `redirect` rule is restricted to `main_frame` and
            `sub_frame`: replacing a sub-resource with an HTML page would break
            the page rather than protect it.
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - main_frame
              - sub_frame
              - stylesheet
              - script
              - image
              - font
              - object
              - xmlhttprequest
              - ping
              - csp_report
              - media
              - websocket
              - webtransport
              - webbundle
              - other

    HealthCheck:
      type: object
      required: [name, ok]
      properties:
        name:
          type: string
          examples: [config, url_fingerprint_hmac_key, url_encryption_key, scan_pipeline, mongodb, provider]
        ok:
          type: boolean
        why:
          type: string
          description: |
            Generic failure description. Never carries driver error text,
            which can embed hosts, topology and credentials, because this
            endpoint is unauthenticated.

    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"

    Problem:
      type: object
      description: RFC 9457 problem detail.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the problem class.
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: The HTTP status code, repeated for convenience.
        detail:
          type: string
          description: |
            Specific explanation, written for the end user. Never contains a raw
            URL, an API key, a driver error, a stack trace, or an internal
            identifier other than `request_id`.
        instance:
          type: string
          description: The request path the problem occurred on.
        request_id:
          type: string
          description: Correlates the failure with server logs.
        code:
          type: string
          description: |
            Stable, low-cardinality error code. Clients branch on this rather
            than parsing `detail`.
          examples:
            - invalid_request
            - validation_error
            - scan_not_found
            - rate_limited
            - not_ready
            - service_unavailable
            - internal_error